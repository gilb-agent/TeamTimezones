<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="inner-glow">
        <feFlood flood-color="rgba(255,255,255,0.2)"/>
        <feComposite operator="out" in2="SourceGraphic"/>
        <feGaussianBlur stdDeviation="2"/>
        <feComposite operator="atop" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#grad1)" />

  <g transform="translate(64 64)" fill="none" stroke="#ffffff">
    <circle cx="0" cy="0" r="40" stroke-width="5" opacity="0.9"/>
    
    <g stroke-width="2" opacity="0.4">
      <ellipse cx="0" cy="0" rx="18" ry="40" />
      <path d="M-40 0 H40" />
      <path d="M-35 -20 H35" />
      <path d="M-35 20 H35" />
    </g>

    <g stroke-linecap="round" stroke-width="6" opacity="1">
      <line x1="0" y1="0" x2="16" y2="-28" />
      <line x1="0" y1="0" x2="-18" y2="-10" stroke-width="7"/>
    </g>
    
    <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="none"/>
  </g>
</svg>