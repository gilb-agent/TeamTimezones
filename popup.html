<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Timezones</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="header-top">
        <a href="https://chromewebstore.google.com/detail/makileokchiliacehpmkecgcehebflbb?utm_source=item-share-cb" target="_blank" rel="noopener noreferrer" class="title">Team Time</a>
        <div class="header-controls">
          <div class="header-toggles">
            <div class="toggle-group">
              <svg class="toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
              <label class="toggle-switch">
                <input type="checkbox" id="darkModeToggle" aria-label="Toggle dark mode">
                <span class="toggle-slider"></span>
              </label>
              <svg class="toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
            </div>
            <div class="toggle-group">
              <span class="toggle-label">12</span>
              <label class="toggle-switch">
                <input type="checkbox" id="timeFormatToggle" aria-label="Toggle 24-hour time format">
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-label">24</span>
            </div>
          </div>
          <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Open settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div id="homeBase" class="home-base hidden clickable">
      <div class="home-city" id="homeCity">--</div>
      <div class="home-content">
        <div class="home-label">Your Time</div>
        <div class="home-time" id="homeTime">--:--</div>
      </div>
    </div>

    <div id="customControls" class="custom hidden">
      <div class="slider-time-label" id="sliderLabel">Set Time in <span id="sliderCityName">Your Location</span></div>
      <div class="slider-wrapper">
        <button class="slider-btn" id="decreaseTimeBtn" aria-label="Decrease time">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <div class="slider-track-container">
          <div class="slider-track-row">
            <div class="slider-track-bg" id="sliderTrackBg"></div>
            <input type="range" id="timeSlider" class="time-slider" min="0" max="1440" step="30" value="720">
          </div>
          <div class="slider-track-labels" aria-hidden="true">
            <span>12 AM</span>
            <span>12 PM</span>
            <span>12 AM</span>
          </div>
        </div>
        <button class="slider-btn" id="increaseTimeBtn" aria-label="Increase time">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
      <div class="slider-time-display">
        <div class="slider-current-time" id="sliderTimeDisplay">12:00 PM</div>
        <div class="slider-date-control">
          <input type="date" id="sliderDatePicker" class="slider-date-picker" tabindex="-1" aria-hidden="true">
          <label class="date-picker-link" id="datePickerLabel" role="button" tabindex="0">Today ›</label>
        </div>
      </div>
    </div>

    <div id="statusSummaryRow" class="status-summary-row hidden">
      <div id="statusSummary" class="status-summary" role="status"></div>
      <div class="summary-actions">
        <button id="copyMessageBtn" class="copy-message-btn" aria-label="Copy times as a message" title="Copy times as a message">
          <svg class="icon-copy" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <svg class="icon-check hidden" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
        <div class="schedule-btn-wrap">
          <button id="scheduleBtn" class="copy-message-btn" aria-label="Schedule on your calendar" title="Schedule on your calendar" aria-haspopup="true" aria-expanded="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </button>
          <div id="scheduleMenu" class="schedule-menu hidden" role="menu">
            <button type="button" class="schedule-menu-item" data-provider="google" role="menuitem">Google Calendar</button>
            <button type="button" class="schedule-menu-item" data-provider="outlook" role="menuitem">Outlook</button>
          </div>
        </div>
      </div>
    </div>

    <div id="groupSwitcher" class="group-switcher hidden"></div>

    <div id="teamFilterWrap" class="team-filter-wrap hidden">
      <svg class="team-filter-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="teamFilterInput" class="team-filter-input" placeholder="Filter team" aria-label="Filter team by name or city">
      <button type="button" id="teamFilterClearBtn" class="team-filter-clear" aria-label="Close filter">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div id="list" class="list">
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.5; margin-bottom: 16px;">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <h3 style="font-size: 16px; font-weight: 500; margin: 0 0 8px 0; color: var(--md-sys-color-on-surface);">Welcome to Team Timezones!</h3>
        <p style="margin: 0 0 20px 0;">Track time across your global team</p>
        <button id="addTeamBtn" class="primary-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add Your First City
        </button>
        <p style="font-size: 11px; margin-top: 12px; opacity: 0.6;">💡 Tip: Try starting with New York, London, or Tokyo</p>
      </div>
    </div>
  </div>
  <script src="constants.js"></script>
  <script src="shared-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
